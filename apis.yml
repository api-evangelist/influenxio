aid: influenxio
name: Influenxio
description: 'Influenxio is an Instagram influencer-marketing platform that connects
  brands with a database of more than 500,000 influencer profiles through an AI-powered
  matching system. Brands use its campaign-management tooling to search, invite, and
  collaborate with influencers at scale for brand awareness, website traffic, and
  affiliate marketing, including a pay-per-click affiliate model and content-authorization
  workflows for reusing user-generated content. It is a B2B SaaS product aimed at
  marketers and brands rather than developers, and does not publish a public API,
  developer portal, or SDKs.'
